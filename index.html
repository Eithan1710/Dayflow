<!doctype html>
<html lang="he" dir="rtl" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dayflow</title>
  <meta name="description" content="Dayflow — תכנון יומי לפי חלקי היום">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dayflow">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="modulepreload" href="js/app.js">
  <link rel="preconnect" href="https://kjfihzskaqcboeejnkak.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('dayflow:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="splash" role="status" aria-label="טוען"><img src="icons/mark.svg" alt="" width="56" height="56"></div>
  </div>
  <div id="overlays"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="fatal">כדי להשתמש ב-Dayflow צריך להפעיל JavaScript.</p></noscript>
</body>
</html>
